<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第9章 上线急诊室 + 职业罗盘</title>
<style>
:root{--bg:#0E2F3A;--teal:#0F6E8C;--accent:#F27A4E;--gold:#E0A82E;--ink:#EAF2F4;--line:#1c4a5a;}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
.wrap{max-width:920px;margin:0 auto;padding:22px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:#9fc2cf;font-size:14px;margin-bottom:14px}
.panel{background:#0c2731;border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
.panel h2{font-size:16px;margin:0 0 10px;color:var(--gold)}
.scene{background:#0a2029;border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0;font-size:14px}
.scene b{color:var(--accent)}
.opt{display:block;margin:6px 0;padding:8px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:14px}
.opt:hover{border-color:var(--accent)}
.opt.right{background:#103a47;border-color:var(--gold);color:var(--gold)}
.opt.wrong{border-color:#e0563f;color:#f0a48f}
.card{background:#103a47;border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;user-select:none;font-size:14px}
.card:hover{border-color:var(--accent)}
.card.sel{outline:2px solid var(--accent);background:#15414f}
.card.used{opacity:.4;pointer-events:none}
.banks{display:flex;gap:10px;flex-wrap:wrap}
.bank{flex:1;min-width:200px;border:1px solid var(--line);border-radius:10px;padding:10px;background:#0a2029}
.bank b{color:var(--gold);display:block;margin-bottom:6px;font-size:14px}
.bank .drop{min-height:40px;display:flex;gap:6px;flex-wrap:wrap}
.feedback{font-size:13px;min-height:18px;margin-top:8px;color:var(--accent)}
.badge{display:none;text-align:center;padding:16px;background:#103a47;border:1px solid var(--gold);border-radius:12px;margin-top:10px;color:var(--gold);font-size:17px}
.badge.show{display:block}
</style>
</head>
<body>
<div class="wrap">
<h1>🚑 第9章 · 上线急诊室 + 职业罗盘</h1>
<div class="sub">前半段处置上线故障，后半段用职业地图确认「学完你能做啥岗」。</div>

<div class="panel">
  <h2>① 上线急诊室（点选正确处置）</h2>
  <div class="scene"><b>故障1：</b>bot 频繁答非所问、编造书名。<div class="opt" data-a="A">A 加服务器</div><div class="opt" data-a="B">B 补知识库并加『不确定就说不知道』约束</div><div class="opt" data-a="C">C 换主题色</div></div>
  <div class="scene"><b>故障2：</b>响应经常超时（>10秒）。<div class="opt" data-a="A">A 缩短提示词 / 加缓存</div><div class="opt" data-a="B">B 改界面字体</div><div class="opt" data-a="C">C 删掉知识库</div></div>
  <div class="scene"><b>故障3：</b>用户投诉隐私——bot 把 A 的信息告诉了 B。<div class="opt" data-a="A">A 调低温度</div><div class="opt" data-a="B">B 加会话隔离与权限校验</div><div class="opt" data-a="C">C 关闭日志</div></div>
  <div class="feedback" id="fb1"></div>
</div>

<div class="panel">
  <h2>② 职业罗盘（点能力卡 → 点对应职业）</h2>
  <div class="banks" id="banks"></div>
  <div style="margin-top:10px"><b style="color:#9fc2cf;font-size:13px">能力卡：</b></div>
  <div class="banks" id="pool" style="margin-top:6px"></div>
  <div class="feedback" id="fb2"></div>
</div>
<div class="badge" id="badge">🎓 结业证书：你已具备信息系统分析与智能体开发的基本素养！</div>
</div>
<script>
// 急诊室
var ans={0:"B",1:"A",2:"B"};var done1=0;
document.querySelectorAll("#fb1").length;
var scenes=document.querySelectorAll(".scene");
scenes.forEach(function(sc,i){
  sc.querySelectorAll(".opt").forEach(function(o){
    o.onclick=function(){
      if(sc.dataset.done)return;
      var right=ans[i];
      sc.dataset.done="1";
      if(o.dataset.a===right){o.classList.add("right");done1++;}
      else{o.classList.add("wrong");sc.querySelector("[data-a='"+right+"']").classList.add("right");}
      document.getElementById("fb1").textContent="已处置 "+(i+1)+"/3"+(done1===3?" · 全部正确 🏅":"");
      if(done1===3&&done2===3)showCert();
    };
  });
});
// 职业罗盘
var jobs=[{j:"信息系统分析工程技术人员",a:"需求分析与系统设计"},{j:"生成式AI系统应用员",a:"搭建与调优智能体"},{j:"低代码开发员",a:"拖拽式应用搭建"}];
var B=document.getElementById("banks"),pool=document.getElementById("pool"),fb2=document.getElementById("fb2");
var sel=null,done2=0;
jobs.forEach(function(jb){
  var d=document.createElement("div");d.className="bank";d.dataset.a=jb.a;
  d.innerHTML="<b>"+jb.j+"</b><div class='drop'></div>";
  d.onclick=function(){
    if(!sel)return;
    if(d.dataset.a===sel.dataset.a){var c=document.createElement("span");c.className="card";c.textContent=sel.dataset.a;c.style.cursor="default";d.querySelector(".drop").appendChild(c);sel.classList.add("used");sel.classList.remove("sel");sel=null;done2++;fb2.textContent="✓ 对应正确";if(done2===jobs.length)showCert();}
    else{d.classList.add("bad");setTimeout(function(){d.classList.remove("bad");},300);fb2.textContent="✗ 这张能力卡不属于该职业，再想想";}
  };
  B.appendChild(d);
});
[{a:"需求分析与系统设计"},{a:"搭建与调优智能体"},{a:"拖拽式应用搭建"}].slice().sort(function(){return Math.random()-0.5}).forEach(function(it){
  var c=document.createElement("div");c.className="card";c.textContent=it.a;c.dataset.a=it.a;
  c.onclick=function(){if(c.classList.contains("used"))return;if(sel)sel.classList.remove("sel");sel=c;c.classList.add("sel");};
  pool.appendChild(c);
});
function showCert(){document.getElementById("badge").classList.add("show");}
</script>
</body>
</html>
