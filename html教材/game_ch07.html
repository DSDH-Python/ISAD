<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第7章 多智能体接力赛</title>
<style>
:root{--bg:#0E2F3A;--teal:#0F6E8C;--accent:#F27A4E;--gold:#E0A82E;--ink:#EAF2F4;--line:#1c4a5a;}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
.wrap{max-width:920px;margin:0 auto;padding:22px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:#9fc2cf;font-size:14px;margin-bottom:14px}
.panel{background:#0c2731;border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
.panel h2{font-size:16px;margin:0 0 10px;color:var(--gold)}
.hint{font-size:13px;color:#9fc2cf;margin-bottom:10px}
.card{background:#103a47;border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;user-select:none;font-size:14px}
.card:hover{border-color:var(--accent)}
.card.used{opacity:.4;pointer-events:none}
.pipe{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;min-height:50px;border:1px dashed var(--line);border-radius:10px;padding:10px}
.pipe .node{background:#15414f;border:1px solid var(--accent);border-radius:8px;padding:8px 12px;font-size:14px}
.arrow{color:var(--gold)}
.btn{background:var(--accent);color:#10212a;border:0;border-radius:8px;padding:9px 16px;font-size:14px;cursor:pointer;font-weight:600;margin-top:8px}
.feedback{font-size:13px;min-height:18px;margin-top:8px;color:var(--accent)}
.badge{display:none;text-align:center;padding:16px;background:#103a47;border:1px solid var(--gold);border-radius:12px;margin-top:10px;color:var(--gold);font-size:17px}
.badge.show{display:block}
</style>
</head>
<body>
<div class="wrap">
<h1>🔗 第7章 · 多智能体接力赛</h1>
<div class="sub">把四个智能体角色按正确顺序排进流水线，让「任务令牌」顺畅跑通。</div>
<div class="panel">
  <h2>角色卡（依次点击，排出流水线顺序）</h2>
  <div class="hint">正确顺序：规划者 → 检索者 → 撰写者 → 审核者</div>
  <div class="pipe" id="pool"></div>
  <div style="margin-top:10px"><b style="color:#9fc2cf;font-size:13px">流水线（点击角色依次填入）：</b></div>
  <div class="pipe" id="flow"></div>
  <div class="feedback" id="fb"></div>
  <button class="btn" id="reset">重置</button>
</div>
<div class="badge" id="badge">🏅 流水线跑通！多智能体分工协作完成交付</div>
</div>
<script>
var roles=["规划者","检索者","撰写者","审核者"];
var pool=document.getElementById("pool"),flow=document.getElementById("flow"),fb=document.getElementById("fb");
var seq=[];
roles.slice().sort(function(){return Math.random()-0.5}).forEach(function(r){
  var c=document.createElement("div");c.className="card";c.textContent=r;c.dataset.r=r;
  c.onclick=function(){if(c.classList.contains("used"))return;seq.push(r);c.classList.add("used");addNode(r);if(seq.length===roles.length)check();};
  pool.appendChild(c);
});
function addNode(r){if(flow.children.length){{var a=document.createElement("span");a.className="arrow";a.textContent="→";flow.appendChild(a);}}var n=document.createElement("span");n.className="node";n.textContent=r;flow.appendChild(n);}
document.getElementById("reset").onclick=function(){seq=[];flow.innerHTML="";Array.prototype.forEach.call(pool.children,function(c){c.classList.remove("used");});fb.textContent="";};
function check(){if(seq.join(">")===roles.join(">")){fb.textContent="✓ 顺序正确，令牌顺利跑通全流程";document.getElementById("badge").classList.add("show");}else{fb.textContent="✗ 顺序不对，点『重置』重排（规划→检索→撰写→审核）";}}
</script>
</body>
</html>
