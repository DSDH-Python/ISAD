<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第3章 需求翻译机</title>
<style>
:root{--bg:#0E2F3A;--teal:#0F6E8C;--accent:#F27A4E;--gold:#E0A82E;--ink:#EAF2F4;--line:#1c4a5a;}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
.wrap{max-width:900px;margin:0 auto;padding:22px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:#9fc2cf;font-size:14px;margin-bottom:14px}
.panel{background:#0c2731;border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
.panel h2{font-size:16px;margin:0 0 10px;color:var(--gold)}
.req{background:#0a2029;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14px}
.field{margin:10px 0}
.field label{font-size:13px;color:#9fc2cf;display:block;margin-bottom:3px}
.field input{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:#0a2029;color:var(--ink);font-size:14px}
.field input.miss{outline:2px solid #e0563f}
.btn{background:var(--accent);color:#10212a;border:0;border-radius:8px;padding:9px 16px;font-size:14px;cursor:pointer;font-weight:600;margin-top:6px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.preview{background:#0a2029;border:1px solid var(--gold);border-radius:10px;padding:12px;font-size:14px;white-space:pre-wrap;margin-top:10px;display:none}
.preview.show{display:block}
.feedback{font-size:13px;min-height:18px;margin-top:8px;color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
<h1>💬 第3章 · 需求翻译机</h1>
<div class="sub">把用户「随口说的需求」翻译成结构化的「提示词规格」——体会「提示词即规格」。</div>
<div class="panel">
  <h2>用户随口说的需求</h2>
  <div class="req">「我想做个 bot，能回答学生关于这门课的问题，最好别瞎编，按教材来，回答简短点。」</div>
</div>
<div class="panel">
  <h2>把它翻译成提示词规格（五要素）</h2>
  <div class="field"><label>角色（Role）</label><input id="f1" placeholder="例如：你是《信息系统分析与设计》课程助教"></div>
  <div class="field"><label>任务（Task）</label><input id="f2" placeholder="例如：回答学生关于本课程的问题"></div>
  <div class="field"><label>上下文（Context）</label><input id="f3" placeholder="例如：依据课程教材与课件，不超出范围"></div>
  <div class="field"><label>格式（Format）</label><input id="f4" placeholder="例如：每条回答不超过 3 句话"></div>
  <div class="field"><label>约束（Constraint）</label><input id="f5" placeholder="例如：不确定的内容如实说不知道，不编造"></div>
  <button class="btn" id="gen">生成提示词</button>
  <div class="feedback" id="fb"></div>
  <div class="preview" id="pv"></div>
  <button class="btn" id="copy" style="display:none">复制提示词</button>
</div>
</div>
<script>
var ids=["f1","f2","f3","f4","f5"];
var names=["角色","任务","上下文","格式","约束"];
document.getElementById("gen").onclick=function(){
  var empty=ids.filter(function(id){return !document.getElementById(id).value.trim();});
  ids.forEach(function(id){document.getElementById(id).classList.remove("miss");});
  var fb=document.getElementById("fb"),pv=document.getElementById("pv"),copy=document.getElementById("copy");
  if(empty.length){empty.forEach(function(id){document.getElementById(id).classList.add("miss");});fb.textContent="✗ 还有 "+empty.length+" 个要素没填（标红处）";pv.className="preview";copy.style.display="none";return;}
  var parts=ids.map(function(id,i){return names[i]+"："+document.getElementById(id).value.trim();});
  var txt="# 提示词规格\n"+parts.join("\n");
  pv.textContent=txt;pv.className="preview show";copy.style.display="inline-block";
  fb.textContent="✓ 五要素齐全，已生成结构化提示词（这就是一份需求规格）";
};
document.getElementById("copy").onclick=function(){
  var txt=document.getElementById("pv").textContent;
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){document.getElementById("fb").textContent="✓ 已复制到剪贴板，可粘进 Coze";});}
  else{document.getElementById("fb").textContent="请手动选中上方文本复制";}
};
</script>
</body>
</html>
